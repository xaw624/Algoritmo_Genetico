# Drop-in de systemd para streamlit@genetico
# Destino: /etc/systemd/system/streamlit@genetico.service.d/limites.conf
#
# El simulador es público (sin login) y de cálculo intensivo. Con estos límites,
# si se excede, systemd frena o reinicia solo este servicio y el resto
# del sistema (SSH, cloudflared, otras apps) sigue respondiendo.
[Service]
# Como máximo 1 núcleo completo
CPUQuota=100%
# Uso normal (Streamlit 1.63): ~40 MB en reposo, ~180 MB en una corrida de 500 x 500
MemoryHigh=400M
MemoryMax=512M
