# Drop-in de systemd para streamlit@genetico
# Destino: /etc/systemd/system/streamlit@genetico.service.d/limites.conf
#
# El simulador es público (sin login) y de cálculo intensivo, y comparte
# servidor con otras apps. Si se excede, systemd frena o reinicia
# solo este servicio en lugar de que el OOM killer elija otra app.
[Service]
# Como máximo 1 núcleo completo
CPUQuota=100%
# Uso normal (Streamlit 1.63): ~40 MB en reposo, ~180 MB en una corrida de 500 x 500
MemoryHigh=400M
MemoryMax=512M
